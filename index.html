<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>S Pen Notes</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<section id="library" class="screen"><header><div><strong>S Pen Notes</strong><small>Meus cadernos</small></div><div class="actions"><button id="importBtn">Restaurar backup</button><button id="backupBtn">Backup</button><button id="createBtn" class="primary">+ Nova anotação</button></div></header><input id="importFile" type="file" accept="application/json,.json" hidden><main class="library-main"><div id="empty" class="empty"><h2>Seu caderno está vazio</h2><p>Crie uma anotação e comece a escrever com a S Pen.</p></div><div id="notes" class="notes"></div></main></section>
<section id="editor" class="screen hidden"><header><div><button id="back">‹ Cadernos</button><input id="title" aria-label="Título"></div><span id="status">Salvo</span></header><nav class="toolbar"><button data-tool="pen" class="active">✒ Caneta</button><button data-tool="eraser">⌫ Borracha</button><label>Cor <input id="color" type="color" value="#111827"></label><label>Espessura <input id="size" type="range" min="1" max="16" value="3"></label><button id="undo">↶</button><button id="redo">↷</button><select id="paper"><option value="blank">Branco</option><option value="lined">Pautado</option><option value="grid">Quadriculado</option></select><button id="newPage">+ Página</button><button id="prev">‹</button><span id="pageInfo">1/1</span><button id="next">›</button><button id="export">PNG</button><button id="exportPdf">PDF completo</button><button id="deletePage">Excluir pág.</button></nav><main class="canvas-wrap"><canvas id="canvas"></canvas></main><footer>S Pen: escreva • salvamento automático</footer></section><script src="vendor/jspdf.umd.min.js"></script><script src="app.js"></script></body></html>
