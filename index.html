<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>S Pen Notes</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=15"></head><body>
<section id="library" class="screen"><header><div><strong>S Pen Notes</strong><small>Meus cadernos • v15</small></div><div class="actions"><button id="importBtn">Restaurar backup</button><button id="backupBtn">Backup</button><button id="createBtn" class="primary">+ Nova anotação</button></div></header><input id="importFile" type="file" accept="application/json,.json" hidden><main class="library-main"><div id="empty" class="empty"><h2>Seu caderno está vazio</h2><p>Crie uma anotação e comece a escrever com a S Pen.</p></div><div id="notes" class="notes"></div></main></section>
<section id="editor" class="screen hidden"><header><div><button id="back">‹ Cadernos</button><input id="title" aria-label="Título"></div><span id="status">Salvo</span></header><nav class="toolbar"><button data-tool="pen" class="active">✒ Caneta</button><button data-tool="eraser">⌫ Borracha</button><button data-tool="highlighter">▰ Marca-texto</button><label>Cor <input id="color" type="color" value="#111827"></label><span class="quick-colors"><button data-color="#111827" title="Preto"></button><button data-color="#2563eb" title="Azul"></button><button data-color="#dc2626" title="Vermelho"></button><button data-color="#facc15" title="Amarelo"></button></span><label>Espessura <input id="size" type="range" min="1" max="16" value="3"></label><button id="undo">↶</button><button id="redo">↷</button><select id="paper"><option value="blank">Branco</option><option value="lined">Pautado</option><option value="grid">Quadriculado</option><option value="dotted">Pontilhado</option><option value="checklist">Checklist</option></select><button id="zoomOut">−</button><span id="zoomInfo">100%</span><button id="zoomIn">＋</button><button id="zoomReset">1:1</button><button id="touchZoom" aria-pressed="false">Zoom por toque: OFF</button><button id="pagesBtn">▤ Páginas</button><button id="newPage">+ Página</button><button id="prev">‹</button><span id="pageInfo">1/1</span><button id="next">›</button><button id="export">PNG</button><button id="exportPdf">PDF completo</button><button id="fullscreen">⛶ Tela cheia</button><button id="deletePage">Excluir pág.</button></nav><main class="workspace"><aside id="pagesPanel" class="pages-panel hidden"><strong>Páginas</strong><div id="pageThumbs"></div></aside><div class="canvas-wrap"><canvas id="canvas"></canvas></div></main><footer>S Pen: escreva • salvamento automático</footer></section><script src="app.js?v=15"></script></body></html>
